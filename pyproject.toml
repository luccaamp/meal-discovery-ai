[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-discovery-ai"
version = "0.3.0"
description = "Meal recommendation and conversational discovery with reproducible evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
meal-discovery = "meal_discovery.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
